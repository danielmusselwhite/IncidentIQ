services:
  incidentiq.api:
    image: ${DOCKER_REGISTRY-}incidentiqapi
    build:
      context: .
      dockerfile: src/IncidentIQ.Api/Dockerfile
    environment:
      - ServiceBus__ConnectionString=Endpoint=sb://servicebus-emulator;SharedAccessKeyName=RootManageSharedAccessKey;SharedAccessKey=SAS_KEY_VALUE;UseDevelopmentEmulator=true;
      - ServiceBus__FullyQualifiedNamespace=servicebus-emulator
      - ServiceBus__AnalyseIncidentQueueName=analyse-incident
    depends_on:
      cosmos:
        condition: service_healthy
      servicebus-emulator:
        condition: service_started
    volumes:
      - cosmos-certs:/cosmos-certs:ro

  incidentiq.worker:
    build:
      context: .
      dockerfile: src/IncidentIQ.Worker/Dockerfile

    depends_on:
      cosmos:
        condition: service_healthy
      servicebus-emulator:
        condition: service_started

    environment:
      Cosmos__Endpoint: "https://cosmos:8081"
      Cosmos__Key: "${COSMOS_EMULATOR_KEY}"
      Cosmos__DatabaseName: "IncidentIQ"
      Cosmos__IncidentsContainerName: "Incidents"
      Cosmos__RunbooksContainerName: "Runbooks"

      ServiceBus__ConnectionString: "Endpoint=sb://servicebus-emulator;SharedAccessKeyName=RootManageSharedAccessKey;SharedAccessKey=SAS_KEY_VALUE;UseDevelopmentEmulator=true;"
      ServiceBus__FullyQualifiedNamespace: "servicebus-emulator"
      ServiceBus__AnalyseIncidentQueueName: "analyse-incident"

      SSL_CERT_FILE: "/cosmos-certs/ca-bundle.crt"

    volumes:
      - cosmos-certs:/cosmos-certs:ro

  cosmos-cert-gen:
    image: alpine:3.24.1
    user: "0:0"
    volumes:
      - cosmos-certs:/cosmos-certs
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e

        apk add --no-cache openssl ca-certificates

        if [ ! -f /cosmos-certs/cosmos.pfx ]; then
          echo "Generating Cosmos development certificate..."

          openssl req -x509 -newkey rsa:2048 -sha256 -days 3650 -nodes \
            -keyout /cosmos-certs/cosmos.key \
            -out /cosmos-certs/cosmos.crt \
            -subj "/CN=cosmos" \
            -addext "subjectAltName=DNS:cosmos,DNS:localhost,IP:127.0.0.1"

          openssl pkcs12 -export \
            -out /cosmos-certs/cosmos.pfx \
            -inkey /cosmos-certs/cosmos.key \
            -in /cosmos-certs/cosmos.crt \
            -passout pass:incidentiq-dev
        else
          echo "Existing Cosmos certificate found; reusing it."
        fi

        cat /etc/ssl/certs/ca-certificates.crt /cosmos-certs/cosmos.crt \
          > /cosmos-certs/ca-bundle.crt

        chmod 644 /cosmos-certs/*

  cosmos:
    image: mcr.microsoft.com/cosmosdb/linux/azure-cosmos-emulator:vnext-latest
    depends_on:
      cosmos-cert-gen:
        condition: service_completed_successfully
    command:
      - "--protocol"
      - "https"
      - "--explorer-protocol"
      - "http"
      - "--gateway-endpoint"
      - "cosmos"
      - "--cert-path"
      - "/cosmos-certs/cosmos.pfx"
    environment:
      - CERT_SECRET=incidentiq-dev
    ports:
      - "8081:8081"
      - "8080:8080"
      - "1234:1234"
    volumes:
      - cosmos-data:/data
      - cosmos-certs:/cosmos-certs:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/ready"]
      interval: 5s
      timeout: 5s
      retries: 20

  servicebus-sql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "${SERVICEBUS_SQL_PASSWORD}"
    volumes:
      - servicebus-sql-data:/var/opt/mssql

  servicebus-emulator:
    image: mcr.microsoft.com/azure-messaging/servicebus-emulator:latest
    depends_on:
      - servicebus-sql
    environment:
      SQL_SERVER: servicebus-sql
      MSSQL_SA_PASSWORD: "${SERVICEBUS_SQL_PASSWORD}"
      ACCEPT_EULA: "Y"
      SQL_WAIT_INTERVAL: "15"
      EMULATOR_HTTP_PORT: "5300"
    volumes:
      - ./infra/local/servicebus/Config.json:/ServiceBus_Emulator/ConfigFiles/Config.json:ro
    ports:
      - "5672:5672"
      - "5300:5300"

volumes:
  cosmos-data:
  cosmos-certs:
  servicebus-sql-data: