name: Tests

on:
  push:
    branches:
      - master

  pull_request:
    branches:
      - master

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore dependencies
        run: dotnet restore ./IncidentIQ.slnx

      - name: Build
        run: dotnet build ./IncidentIQ.slnx --no-restore --configuration Release

      - name: Run tests
        run: dotnet test ./IncidentIQ.slnx --no-build --configuration Release