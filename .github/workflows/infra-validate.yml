name: Validate Infrastructure

on:
  pull_request:
    branches:
      - main
    paths:
      - "infra/**"
      - ".github/workflows/infra-*.yml"

jobs:
  validate:
    name: Validate Bicep
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate main Bicep
        run: az bicep build --file infra/main.bicep --stdout > /dev/null

      - name: Validate bootstrap Bicep
        run: az bicep build --file infra/bootstrap/main.bicep --stdout > /dev/null

      - name: Validate development parameters
        run: az bicep build-params --file infra/environments/dev.bicepparam --stdout > /dev/null