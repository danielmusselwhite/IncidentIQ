name: Deploy Development Infrastructure

on:
  push:
    branches:
      - main
    paths:
      - "infra/**"
      - ".github/workflows/infra-deploy.yml"

  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    name: Deploy Development
    runs-on: ubuntu-latest
    environment: development

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Validate development infrastructure
        run: az bicep build-params --file infra/environments/dev.bicepparam --stdout > /dev/null

      - name: Preview infrastructure changes
        run: >
          az deployment group what-if
          --resource-group rg-incidentiq-dev
          --parameters infra/environments/dev.bicepparam

      - name: Deploy development infrastructure
        run: >
          az deployment group create
          --name incidentiq-${{ github.run_number }}
          --resource-group rg-incidentiq-dev
          --parameters infra/environments/dev.bicepparam